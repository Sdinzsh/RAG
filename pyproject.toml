[project]
name = "rag"
version = "0.2.0"
description = "Vectorless RAG — local document intelligence, Ollama-only, no cloud APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pymupdf>=1.24.0",
    "requests>=2.31.0",
    "werkzeug>=3.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
rag = "app:main"
